# =============================================================================
# LOGSTASH PIPELINE - NIDS Sistema Completo v2.1
# Basado en tu pipeline original v2.0
# CAMBIOS:
#   1. Parsing JSON para conn.log (tu Zeek genera JSON, no TSV)
#   2. Correlación UID para obtener IPs en flowmeter
#   3. Formato correcto para ML API (array de features)
# =============================================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  
  # =========================================================================
  # PASO 0: Identificar tipo de log desde Filebeat fields
  # =========================================================================
  
  if [fields][log_type] == "conn" {
    mutate { add_field => { "log_type" => "conn" } }
  } else if [fields][log_type] == "flowmeter" {
    mutate { add_field => { "log_type" => "flowmeter" } }
  }
  
  # =========================================================================
  # PASO 1: Identificar tipo de log y parsear
  # =========================================================================
  
  if [log_type] == "conn" {
    # ----- CONN.LOG (JSON - tu Zeek genera JSON) -----
    
    # Ignorar líneas de comentario
    if [message] =~ /^#/ {
      drop { }
    }
    
    # Parsear JSON de conn.log
    json {
      source => "message"
      target => "zeek_conn"
    }
    
    # Extraer campos de Zeek JSON (con puntos en nombres)
    ruby {
      code => '
        z = event.get("zeek_conn")
        if z
          event.set("ts", z["ts"])
          event.set("uid", z["uid"])
          event.set("src_ip", z["id.orig_h"])
          event.set("src_port", z["id.orig_p"])
          event.set("dst_ip", z["id.resp_h"])
          event.set("dst_port", z["id.resp_p"])
          event.set("proto", z["proto"])
          event.set("service", z["service"])
          event.set("duration", z["duration"])
          event.set("orig_bytes", z["orig_bytes"])
          event.set("resp_bytes", z["resp_bytes"])
          event.set("conn_state", z["conn_state"])
          event.set("local_orig", z["local_orig"])
          event.set("local_resp", z["local_resp"])
          event.set("missed_bytes", z["missed_bytes"])
          event.set("history", z["history"])
          event.set("orig_pkts", z["orig_pkts"])
          event.set("orig_ip_bytes", z["orig_ip_bytes"])
          event.set("resp_pkts", z["resp_pkts"])
          event.set("resp_ip_bytes", z["resp_ip_bytes"])
          event.set("tunnel_parents", z["tunnel_parents"])
        end
      '
    }
    
    # Limpiar objeto temporal
    mutate {
      remove_field => ["zeek_conn"]
    }
    
    # Convertir tipos numéricos
    mutate {
      convert => {
        "src_port" => "integer"
        "dst_port" => "integer"
        "duration" => "float"
        "orig_bytes" => "integer"
        "resp_bytes" => "integer"
        "orig_pkts" => "integer"
        "resp_pkts" => "integer"
        "missed_bytes" => "integer"
        "orig_ip_bytes" => "integer"
        "resp_ip_bytes" => "integer"
      }
    }
    
    # Limpiar valores "-" o null (campos vacíos de Zeek)
    ruby {
      code => '
        event.to_hash.each do |k, v|
          if v == "-" || v == ""
            event.set(k, nil)
          end
        end
      '
    }
    
    # Agregar campos calculados
    ruby {
      code => '
        orig_bytes = event.get("orig_bytes") || 0
        resp_bytes = event.get("resp_bytes") || 0
        event.set("total_bytes", orig_bytes + resp_bytes)
        
        orig_pkts = event.get("orig_pkts") || 0
        resp_pkts = event.get("resp_pkts") || 0
        event.set("total_pkts", orig_pkts + resp_pkts)
        
        duration = event.get("duration") || 0
        if duration > 0
          event.set("bytes_per_sec", (orig_bytes + resp_bytes) / duration)
          event.set("pkts_per_sec", (orig_pkts + resp_pkts) / duration)
        else
          event.set("bytes_per_sec", 0)
          event.set("pkts_per_sec", 0)
        end
      '
    }
    
    # =========================================================================
    # NUEVO: Guardar IPs en memoria para correlación con flowmeter
    # =========================================================================
    aggregate {
      task_id => "%{uid}"
      code => "
        map['src_ip'] = event.get('src_ip')
        map['src_port'] = event.get('src_port')
        map['dst_ip'] = event.get('dst_ip')
        map['dst_port'] = event.get('dst_port')
        map['proto'] = event.get('proto')
        map['service'] = event.get('service')
        map['duration'] = event.get('duration')
        map['conn_state'] = event.get('conn_state')
        if map['flow_duration']
          map.each { |k, v| event.set(k, v) }
          event.set('data_source', 'zeek_flowmeter')
          event.set('log_type', 'flowmeter')
          event.set('uid_correlated', true)
          map.clear
        end
      "
      map_action => "create_or_update"
      timeout => 600
      push_map_as_event_on_timeout => true
      timeout_task_id_field => "uid"
      timeout_code => "event.set('uid_correlated', false)"
    }
    
    # Marcar como solo conn (sin ML) si no se fusiono flowmeter
    ruby {
      code => '
        if event.get("data_source") != "zeek_flowmeter"
          event.set("ml_processed", false)
          event.set("data_source", "zeek_conn")
        end
      '
    }
  }
  
  else if [log_type] == "flowmeter" {
    # ----- FLOWMETER.LOG (JSON) -----
    
    # Parsear JSON
    json {
      source => "message"
      target => "zeek_flow"
    }
    
    # Extraer UID primero para correlación
    ruby {
      code => '
        f = event.get("zeek_flow")
        if f
          event.set("uid", f["uid"])
          event.set("ts", f["ts"]) if f["ts"]
        end
      '
    }
    
    # Extraer TODOS los campos de flowmeter
    ruby {
      code => '
        f = event.get("zeek_flow")
        if f
          # Campos básicos
          event.set("flow_duration", f["flow_duration"])
          event.set("fwd_pkts_tot", f["fwd_pkts_tot"])
          event.set("bwd_pkts_tot", f["bwd_pkts_tot"])
          event.set("fwd_data_pkts_tot", f["fwd_data_pkts_tot"])
          event.set("bwd_data_pkts_tot", f["bwd_data_pkts_tot"])
          event.set("fwd_pkts_per_sec", f["fwd_pkts_per_sec"])
          event.set("bwd_pkts_per_sec", f["bwd_pkts_per_sec"])
          event.set("flow_pkts_per_sec", f["flow_pkts_per_sec"])
          event.set("down_up_ratio", f["down_up_ratio"])
          
          # Header sizes
          event.set("fwd_header_size_tot", f["fwd_header_size_tot"])
          event.set("fwd_header_size_min", f["fwd_header_size_min"])
          event.set("fwd_header_size_max", f["fwd_header_size_max"])
          event.set("bwd_header_size_tot", f["bwd_header_size_tot"])
          event.set("bwd_header_size_min", f["bwd_header_size_min"])
          event.set("bwd_header_size_max", f["bwd_header_size_max"])
          
          # Flags
          event.set("flow_FIN_flag_count", f["flow_FIN_flag_count"])
          event.set("flow_SYN_flag_count", f["flow_SYN_flag_count"])
          event.set("flow_RST_flag_count", f["flow_RST_flag_count"])
          event.set("flow_ACK_flag_count", f["flow_ACK_flag_count"])
          event.set("fwd_PSH_flag_count", f["fwd_PSH_flag_count"])
          event.set("bwd_PSH_flag_count", f["bwd_PSH_flag_count"])
          event.set("fwd_URG_flag_count", f["fwd_URG_flag_count"])
          event.set("bwd_URG_flag_count", f["bwd_URG_flag_count"])
          event.set("flow_CWR_flag_count", f["flow_CWR_flag_count"])
          event.set("flow_ECE_flag_count", f["flow_ECE_flag_count"])
          
          # Payload stats (con puntos en nombres originales)
          event.set("fwd_pkts_payload_min", f["fwd_pkts_payload_min"])
          event.set("fwd_pkts_payload_max", f["fwd_pkts_payload_max"])
          event.set("fwd_pkts_payload_tot", f["fwd_pkts_payload_tot"])
          event.set("fwd_pkts_payload_avg", f["fwd_pkts_payload_avg"])
          event.set("fwd_pkts_payload_std", f["fwd_pkts_payload_std"])
          event.set("bwd_pkts_payload_min", f["bwd_pkts_payload_min"])
          event.set("bwd_pkts_payload_max", f["bwd_pkts_payload_max"])
          event.set("bwd_pkts_payload_tot", f["bwd_pkts_payload_tot"])
          event.set("bwd_pkts_payload_avg", f["bwd_pkts_payload_avg"])
          event.set("bwd_pkts_payload_std", f["bwd_pkts_payload_std"])
          event.set("flow_pkts_payload_min", f["flow_pkts_payload_min"])
          event.set("flow_pkts_payload_max", f["flow_pkts_payload_max"])
          event.set("flow_pkts_payload_tot", f["flow_pkts_payload_tot"])
          event.set("flow_pkts_payload_avg", f["flow_pkts_payload_avg"])
          event.set("flow_pkts_payload_std", f["flow_pkts_payload_std"])
          
          # IAT stats
          event.set("fwd_iat_min", f["fwd_iat_min"])
          event.set("fwd_iat_max", f["fwd_iat_max"])
          event.set("fwd_iat_tot", f["fwd_iat_tot"])
          event.set("fwd_iat_avg", f["fwd_iat_avg"])
          event.set("fwd_iat_std", f["fwd_iat_std"])
          event.set("bwd_iat_min", f["bwd_iat_min"])
          event.set("bwd_iat_max", f["bwd_iat_max"])
          event.set("bwd_iat_tot", f["bwd_iat_tot"])
          event.set("bwd_iat_avg", f["bwd_iat_avg"])
          event.set("bwd_iat_std", f["bwd_iat_std"])
          event.set("flow_iat_min", f["flow_iat_min"])
          event.set("flow_iat_max", f["flow_iat_max"])
          event.set("flow_iat_tot", f["flow_iat_tot"])
          event.set("flow_iat_avg", f["flow_iat_avg"])
          event.set("flow_iat_std", f["flow_iat_std"])
          
          # Payload bytes per second
          event.set("payload_bytes_per_second", f["payload_bytes_per_second"])
          
          # Subflow stats
          event.set("fwd_subflow_pkts", f["fwd_subflow_pkts"])
          event.set("bwd_subflow_pkts", f["bwd_subflow_pkts"])
          event.set("fwd_subflow_bytes", f["fwd_subflow_bytes"])
          event.set("bwd_subflow_bytes", f["bwd_subflow_bytes"])
          
          # Bulk stats
          event.set("fwd_bulk_bytes", f["fwd_bulk_bytes"])
          event.set("bwd_bulk_bytes", f["bwd_bulk_bytes"])
          event.set("fwd_bulk_packets", f["fwd_bulk_packets"])
          event.set("bwd_bulk_packets", f["bwd_bulk_packets"])
          event.set("fwd_bulk_rate", f["fwd_bulk_rate"])
          event.set("bwd_bulk_rate", f["bwd_bulk_rate"])
          
          # Active/Idle stats
          event.set("active_min", f["active_min"])
          event.set("active_max", f["active_max"])
          event.set("active_tot", f["active_tot"])
          event.set("active_avg", f["active_avg"])
          event.set("active_std", f["active_std"])
          event.set("idle_min", f["idle_min"])
          event.set("idle_max", f["idle_max"])
          event.set("idle_tot", f["idle_tot"])
          event.set("idle_avg", f["idle_avg"])
          event.set("idle_std", f["idle_std"])
          
          # Window sizes
          event.set("fwd_init_win_bytes", f["fwd_init_win_bytes"])
          event.set("bwd_init_win_bytes", f["bwd_init_win_bytes"])
        end
      '
    }
    
    # Limpiar objeto temporal
    mutate {
      remove_field => ["zeek_flow"]
    }
    
    mutate {
      add_field => {
        "data_source" => "zeek_flowmeter"
      }
    }
    
    # Convertir tipos numéricos de flowmeter
    mutate {
      convert => {
        "flow_duration" => "float"
        "fwd_pkts_tot" => "integer"
        "bwd_pkts_tot" => "integer"
        "fwd_pkts_per_sec" => "float"
        "bwd_pkts_per_sec" => "float"
        "flow_pkts_per_sec" => "float"
        "fwd_init_win_bytes" => "integer"
        "bwd_init_win_bytes" => "integer"
        "flow_FIN_flag_count" => "integer"
        "flow_SYN_flag_count" => "integer"
        "flow_RST_flag_count" => "integer"
        "flow_ACK_flag_count" => "integer"
        "fwd_PSH_flag_count" => "integer"
        "bwd_PSH_flag_count" => "integer"
        "dst_port" => "integer"
        "src_port" => "integer"
      }
    }
    
    # =========================================================================
    # NUEVO: Correlación UID - Asegurar conn antes de indexar flowmeter
    # =========================================================================
    aggregate {
      task_id => "%{uid}"
      code => "
        if map['src_ip']
          event.set('src_ip', map['src_ip'])
          event.set('src_port', map['src_port'])
          event.set('dst_ip', map['dst_ip'])
          event.set('dst_port', map['dst_port'])
          event.set('proto', map['proto'])
          event.set('service', map['service'])
          event.set('uid_correlated', true)
          map.clear
        else
          map.merge!(event.to_hash)
          event.cancel
        end
      "
      map_action => "create_or_update"
    }
  }
  
  # =========================================================================
  # PASO 2: Llamar API de Machine Learning (FORMATO CORREGIDO)
  # =========================================================================
  
  if [data_source] == "zeek_flowmeter" {
    ruby {
      code => '
        require "net/http"
        require "uri"
        require "json"
        
        begin
          # Construir array de 22 features (formato que espera la API)
          # FEATURES CORREGIDAS - ORDEN EXACTO DEL MODELO
          fwd_payload = (event.get("fwd_pkts_payload_tot") || 0).to_f
          duration = (event.get("flow_duration") || 0.001).to_f
          duration = 0.001 if duration <= 0
          xhr = fwd_payload / duration
          proto = (event.get("proto") || "").to_s.downcase
          protocol_6 = (proto == "tcp" || proto == "6") ? 1.0 : 0.0
          protocol_17 = (proto == "udp" || proto == "17") ? 1.0 : 0.0
          fwd_psh = (event.get("fwd_PSH_flag_count") || 0).to_f
          bwd_psh = (event.get("bwd_PSH_flag_count") || 0).to_f
          psh_total = fwd_psh + bwd_psh
          features = [
            (event.get("dst_port") || 0).to_f,
            xhr,
            (event.get("fwd_pkts_payload_max") || 0).to_f,
            (event.get("fwd_pkts_payload_min") || 0).to_f,
            (event.get("fwd_pkts_payload_avg") || 0).to_f,
            (event.get("bwd_pkts_payload_min") || 0).to_f,
            (event.get("bwd_pkts_payload_avg") || 0).to_f,
            (event.get("bwd_iat_tot") || 0).to_f,
            (event.get("bwd_iat_avg") || 0).to_f,
            (event.get("bwd_iat_max") || 0).to_f,
            fwd_psh,
            (event.get("fwd_pkts_per_sec") || 0).to_f,
            (event.get("bwd_pkts_per_sec") || 0).to_f,
            (event.get("flow_RST_flag_count") || 0).to_f,
            psh_total,
            (event.get("flow_ACK_flag_count") || 0).to_f,
            (event.get("fwd_init_win_bytes") || 0).to_f,
            (event.get("bwd_init_win_bytes") || 0).to_f,
            (event.get("fwd_header_size_min") || 0).to_f,
            (event.get("idle_min") || 0).to_f,
            protocol_6,
            protocol_17
          ]
          
          # Llamar a la API ML (nombre correcto del contenedor: ml-api)
          uri = URI.parse("http://ml-api:5000/predict")
          http = Net::HTTP.new(uri.host, uri.port)
          http.open_timeout = 2
          
          request = Net::HTTP::Post.new(uri.path)
          request["Content-Type"] = "application/json"
          request.body = {"features" => features, "uid" => event.get("uid")}.to_json
          
          response = http.request(request)
          
          if response.code == "200"
            result = JSON.parse(response.body)
            attack_threshold = 0.3
            pred = result["prediction"]
            conf = result["confidence"].to_f
            is_attack = pred != "Benign" && conf >= attack_threshold
            is_suspicious = pred != "Benign" && conf < attack_threshold
            
            # Guardar resultados ML en objeto anidado
            event.set("[ml][prediction]", result["prediction"])
            event.set("[ml][prediction_code]", result["attack_code"])
            event.set("[ml][confidence]", conf)
            event.set("[ml][raw_is_attack]", result["is_attack"])
            event.set("[ml][is_attack]", is_attack)
            event.set("[ml][severity]", result["severity"])
            event.set("[ml][model]", "RandomForest")
            event.set("[ml][processed]", true)
            event.set("[ml][timestamp]", Time.now.utc.iso8601)
            
            # Copiar a nivel raíz para facilitar búsquedas
            event.set("attack_type", result["prediction"])
            event.set("attack_code", result["attack_code"])
            event.set("ml_confidence", conf)
            event.set("is_attack", is_attack)
            event.set("ml_suspicious", is_suspicious)
            event.set("alert_state", is_attack ? "attack" : (is_suspicious ? "suspicious" : "benign"))
            event.set("severity", result["severity"])
            event.set("ml_processed", true)
          else
            event.set("[ml][error]", "API returned #{response.code}")
            event.set("[ml][processed]", false)
            event.set("ml_processed", false)
            event.set("is_attack", false)
            event.set("ml_suspicious", false)
            event.set("alert_state", "unknown")
            event.set("severity", "unknown")
          end
          
        rescue => e
          event.set("[ml][error]", e.message)
          event.set("[ml][processed]", false)
          event.set("ml_processed", false)
          event.set("is_attack", false)
          event.set("ml_suspicious", false)
          event.set("alert_state", "unknown")
          event.set("severity", "unknown")
        end
      '
    }
    
    # Calcular campos derivados para análisis (TU CÓDIGO ORIGINAL)
    ruby {
      code => '
        # Calcular xhr (throughput forward)
        fwd_payload = event.get("fwd_pkts_payload_tot") || 0
        duration = event.get("flow_duration") || 0.001
        duration = 0.001 if duration == 0
        event.set("xhr", fwd_payload.to_f / duration.to_f)
        
        # Total flags
        fwd_psh = event.get("fwd_PSH_flag_count") || 0
        bwd_psh = event.get("bwd_PSH_flag_count") || 0
        event.set("total_psh_flags", fwd_psh + bwd_psh)
        
        syn = event.get("flow_SYN_flag_count") || 0
        ack = event.get("flow_ACK_flag_count") || 0
        rst = event.get("flow_RST_flag_count") || 0
        fin = event.get("flow_FIN_flag_count") || 0
        event.set("total_tcp_flags", syn + ack + rst + fin)
        
        # Total paquetes
        fwd_pkts = event.get("fwd_pkts_tot") || 0
        bwd_pkts = event.get("bwd_pkts_tot") || 0
        event.set("total_pkts", fwd_pkts + bwd_pkts)
        
        # Total bytes
        fwd_bytes = event.get("fwd_pkts_payload_tot") || 0
        bwd_bytes = event.get("bwd_pkts_payload_tot") || 0
        event.set("total_bytes", fwd_bytes + bwd_bytes)
        
        # Ratio direccional
        if bwd_pkts > 0
          event.set("fwd_bwd_ratio", fwd_pkts.to_f / bwd_pkts.to_f)
        else
          event.set("fwd_bwd_ratio", fwd_pkts.to_f)
        end
      '
    }
  }
  
  # =========================================================================
  # PASO 3: Enriquecimiento común para ambos tipos (TU CÓDIGO ORIGINAL)
  # =========================================================================
  
  # Timestamp
  if [ts] {
    date {
      match => [ "ts", "UNIX", "UNIX_MS", "ISO8601" ]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }
  
  # Si no hay timestamp válido, usar ahora
  if "_dateparsefailure" in [tags] or ![@timestamp] {
    ruby {
      code => 'event.set("@timestamp", Time.now.utc)'
    }
  }
  
  # Clasificar protocolo numérico
  if [proto] {
    mutate {
      add_field => { "proto_upper" => "%{proto}" }
    }
    mutate {
      uppercase => [ "proto_upper" ]
    }
    
    if [proto_upper] == "TCP" or [proto] == "6" {
      mutate {
        add_field => { "protocol_name" => "TCP" }
        add_field => { "protocol_number" => 6 }
      }
    } else if [proto_upper] == "UDP" or [proto] == "17" {
      mutate {
        add_field => { "protocol_name" => "UDP" }
        add_field => { "protocol_number" => 17 }
      }
    } else if [proto_upper] == "ICMP" or [proto] == "1" {
      mutate {
        add_field => { "protocol_name" => "ICMP" }
        add_field => { "protocol_number" => 1 }
      }
    }
  }
  
  # Clasificar puerto por servicio común
  if [dst_port] {
    ruby {
      code => '
        port = event.get("dst_port")
        service_map = {
          20 => "FTP-Data", 21 => "FTP", 22 => "SSH", 23 => "Telnet",
          25 => "SMTP", 53 => "DNS", 80 => "HTTP", 110 => "POP3",
          143 => "IMAP", 443 => "HTTPS", 445 => "SMB", 993 => "IMAPS",
          995 => "POP3S", 1433 => "MSSQL", 1521 => "Oracle", 3306 => "MySQL",
          3389 => "RDP", 5432 => "PostgreSQL", 5900 => "VNC", 8080 => "HTTP-Proxy",
          8443 => "HTTPS-Alt", 27017 => "MongoDB", 6379 => "Redis"
        }
        
        if service_map[port]
          event.set("port_service", service_map[port])
        elsif port < 1024
          event.set("port_service", "Well-Known")
        elsif port < 49152
          event.set("port_service", "Registered")
        else
          event.set("port_service", "Dynamic")
        end
        
        # Clasificar por categoría
        if [21, 22, 23, 3389, 5900].include?(port)
          event.set("port_category", "Remote Access")
        elsif [80, 443, 8080, 8443].include?(port)
          event.set("port_category", "Web")
        elsif [25, 110, 143, 993, 995].include?(port)
          event.set("port_category", "Email")
        elsif [1433, 1521, 3306, 5432, 27017, 6379].include?(port)
          event.set("port_category", "Database")
        elsif port == 53
          event.set("port_category", "DNS")
        else
          event.set("port_category", "Other")
        end
      '
    }
  }
  
  # Agregar metadatos del evento
  mutate {
    add_field => {
      "event_type" => "network_flow"
      "pipeline_version" => "2.1"
      "[event][dataset]" => "nids"
      "[event][module]" => "zeek"
    }
    remove_field => [ "message", "host", "agent", "ecs", "input", "log", "proto_upper", "fields" ]
  }
  
  # Agregar hora del día para análisis temporal
  ruby {
    code => '
      ts = event.get("@timestamp")
      if ts
        t = Time.parse(ts.to_s)
        event.set("hour_of_day", t.hour)
        event.set("day_of_week", t.wday)
        event.set("is_business_hours", (t.hour >= 8 && t.hour <= 18 && t.wday >= 1 && t.wday <= 5))
      end
    '
  }
}

output {
  # =========================================================================
  # Salida principal: Todos los eventos a índice diario
  # =========================================================================
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nids-flows-%{+YYYY.MM.dd}"
  }
  
  # =========================================================================
  # Salida adicional: Solo ataques a índice separado
  # =========================================================================
  if [attack_code] and [attack_code] != 0 {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nids-attacks-%{+YYYY.MM.dd}"
    }
  }
  
  # =========================================================================
  # Salida adicional: Alertas críticas
  # =========================================================================
  if [severity] == "critical" or [severity] == "high" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nids-critical-%{+YYYY.MM.dd}"
    }
  }
}
